defaults:
  - data: perturbation
  - model: scvi
  - training: scvi
  - _self_
  

# output_dir must be an absolute path (so that launch scripts are fully descriptive)
name: scvi_debug
output_dir: ./outputs
overwrite: true

# don't save hydra output
hydra:
  output_subdir: null
  run:
    dir: .
  job_logging:
    formatters:
      simple:
        format: "[%(levelname)s] %(message)s"  # Simple format for logging
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        level: INFO
        stream: ext://sys.stdout
    root:
      level: INFO
    loggers:
      __main__:
        level: DEBUG
        handlers: [console]
        propagate: false
